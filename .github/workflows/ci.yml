name: CI

# Thin caller over the shared regime; see jhheider/rust-ci. Public repo, so CI
# runs on the full hosted matrix (never self-hosted: fork PRs would run
# arbitrary code). The main job builds and tests the default backend (ring); a
# second job exercises the fully-pure-Rust `rustcrypto` backend, which the
# default build compiles out.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE*", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE*", ".gitignore"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: jhheider/rust-ci/.github/workflows/ci.yml@v1
    with:
      coverage: true
    secrets: inherit

  rustcrypto:
    name: RustCrypto backend
    runs-on: ubuntu-latest
    steps:
      - uses: jhheider/rust-ci/actions/setup-rust@v1
        with:
          shared-key: rustcrypto
      - run: cargo clippy --no-default-features --features rustcrypto --all-targets -- -D warnings
      - run: cargo test --no-default-features --features rustcrypto
