name: CI

# Thin caller over the shared regime; see jhheider/rust-ci. Private repo while
# it is pre-publish, so everything routes to the self-hosted runner. The main
# job builds and tests the default backend (ring); a second job exercises the
# fully-pure-Rust `rustcrypto` backend, which the default build compiles out.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE*", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE*", ".gitignore"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: jhheider/rust-ci/.github/workflows/ci.yml@v1
    with:
      os: '["self-hosted"]'
      runs-on: self-hosted
      coverage: true
    secrets: inherit

  rustcrypto:
    name: RustCrypto backend
    runs-on: self-hosted
    steps:
      - uses: jhheider/rust-ci/actions/setup-rust@v1
        with:
          shared-key: rustcrypto
      - run: cargo clippy --no-default-features --features rustcrypto --all-targets -- -D warnings
      - run: cargo test --no-default-features --features rustcrypto
